<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=yes,maximum-scale=5,viewport-fit=cover" />
  <title>機材検索 </title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  
  <link rel="stylesheet" href="app.css?v=1.0.1">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-60WZ8CXVBX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-60WZ8CXVBX');
  </script>

</head>

<body class="bg-blue-80 text-slate-900 antialiased">

<div class="w-full max-w-screen-xl mx-auto min-h-screen flex flex-col bg-white shadow-xl">
  <header class="sticky top-0 bg-white/85 backdrop-blur-xl z-40 px-5 pt-4 pb-5 border-b border-slate-200/60 shadow-sm">
  <div class="flex items-center justify-between mb-5">
    
    <!-- ★ここを変更：アイコンとタイトルを横並びにするグループ -->
    <div class="flex items-center gap-3">
      <!-- 小さくしたアイコン画像（角を少し丸めて影をつけています） -->
      <img src="icon.png" alt="アプリアイコン" class="w-8 h-8 rounded-lg shadow-sm border border-slate-100 object-cover">
      
      <!-- タイトル：少しグラデーションを入れて高級感を出す -->
      <h1 class="text-2xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-800 to-slate-700">
        機材検索
      </h1>
    </div>

    <!-- 件数バッジ：より目立たせ、ラベルを追加 -->
    <div class="flex items-center gap-2">
      <span class="text-[10px] font-bold text-slate-400 tracking-wider">該当件数</span>
      <span id="hit-count" class="bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-full shadow-md shadow-blue-600/20">-- 件</span>
    </div>
  </div>

  <!-- インストールダイアログ（既存機能維持） -->
  <div id="install-area" class="mb-6 bg-blue-600 rounded-[32px] p-6 shadow-xl shadow-blue-900/20 transition-all duration-300" style="display:none;">
    <div class="flex flex-col items-center text-center gap-5">
      <div class="space-y-2">
        <div class="text-3xl">📱</div>
        <h2 class="text-white text-lg font-black tracking-tight">アプリ版をホーム画面に追加</h2>
        <p class="text-blue-100 text-[11px] font-medium leading-relaxed opacity-90">
          全画面表示で、機材検索がもっとスムーズに。<br>オフラインでも使いやすくなります。
        </p>
      </div>
      <div class="flex flex-col w-full gap-3">
        <button onclick="openInstallDialog()" class="w-full bg-white text-blue-700 py-3.5 rounded-2xl text-sm font-black shadow-lg active:scale-[0.97] transition-all">
          ホーム画面に追加する
        </button>
        <button onclick="hideInstallBar()" class="text-white/60 text-xs font-bold hover:text-white transition-colors py-1">
          今はしない
        </button>
      </div>
    </div>
  </div>
  
  <!-- 検索・フィルターエリア -->
  <div class="flex flex-col md:flex-row gap-3">
    
    <!-- 検索バー -->
    <div class="relative flex-[2] group">
      <!-- 虫眼鏡アイコン -->
      <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400 group-focus-within:text-blue-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <input id="q" type="search" placeholder="機材名・コードで検索..." 
             class="w-full pl-11 pr-4 py-3.5 rounded-2xl bg-slate-100/80 border border-transparent focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 transition-all text-sm font-bold text-slate-800 placeholder-slate-400 shadow-inner appearance-none" />
    </div>

    <!-- フィルター群 -->
    <div class="flex flex-1 gap-2">
      <!-- カテゴリフィルター -->
      <div class="relative w-full">
        <select id="cat" class="w-full appearance-none pl-4 pr-10 py-3.5 rounded-2xl bg-white border border-slate-200 text-sm font-bold text-slate-600 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 transition-all shadow-sm cursor-pointer"></select>
        <!-- カスタムの矢印アイコン -->
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
      
      <!-- Baseフィルター -->
      <div class="relative w-full">
        <select id="base" class="w-full appearance-none pl-4 pr-10 py-3.5 rounded-2xl bg-white border border-slate-200 text-sm font-bold text-slate-600 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/15 transition-all shadow-sm cursor-pointer">
          <option value="">全Base</option>
        </select>
        <!-- カスタムの矢印アイコン -->
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
        </div>
      </div>
    </div>
  </div>
</header>

 <main class="flex-1 bg-slate-300">
  <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6">
      <div id="loading-state" class="p-10 text-center text-slate-400">
        <div class="animate-pulse flex flex-col items-center">
          <div class="w-12 h-12 bg-slate-200 rounded-full mb-4"></div>
          <p class="text-sm">データを読み込み中...</p>
        </div>
      </div>
    </div>
  </main>


  <footer class="p-4 safe-area-bottom text-center">
    <p class="text-[10px] text-slate-300 uppercase tracking-widest">Equipment Search System v2.0</p>
  </footer>
</div>

<div id="modal" onclick="closeModal()">
  <div id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<script>
let rawData = [], viewData = [], colMap = {};
const el = id => document.getElementById(id);

// 1. 起動時にキャッシュをチェック
async function loadData() {
  const url = "https://script.google.com/macros/s/AKfycbx-07D6SfSB4UJ4o5LlE5gLaQ2WegQiDkrgnWENzkR6-7RTy9xrw2goIJO7uTMCJd8aDQ/exec";
  const CACHE_KEY = 'equipment_data_cache';

  // ローカルストレージからデータを読み込む
  const cachedData = localStorage.getItem(CACHE_KEY);
  if (cachedData) {
    rawData = JSON.parse(cachedData);
    initAfterLoad(); // キャッシュがあれば即座に表示
    console.log("Cache loaded: Instant display");
  }

  // 裏側で最新データを取得（バックグラウンド更新）
  try {
    const res = await fetch(url);
    const newData = await res.json();
    
    // データが更新されていた場合、またはキャッシュがなかった場合のみ再描画
    if (JSON.stringify(newData) !== cachedData) {
      rawData = newData;
      localStorage.setItem(CACHE_KEY, JSON.stringify(newData));
      initAfterLoad();
      console.log("Data updated from Spreadsheet");
    }
  } catch (e) {
    if (!cachedData) {
      el('list').innerHTML = `<div class="p-10 text-center text-red-500">通信エラー（初回はネット接続が必要です）</div>`;
    }
  }
}

function initAfterLoad() {
  normalizeColumns();
  bindCategoryOptions();
  bindBaseOptions();
  applyFilters();
}

function normalizeColumns(){
  // カラムマッピングの定義
  const map={
    code:['機材コード','code'], category:['区分','category'], name:['機材名','name'],
    weight:['単品重量（kg)','weight'], id:['機材ＣＤ','機材CD','id'], stock:['結束数（本）','stock']
  };
  for(const key in map) colMap[key]=map[key].find(c=>c in rawData[0])||'';
  
  colMap.baseRegions={
    "North": ['宮城仙台第二Base','青森東通Base','福島広野Base','岩手盛岡Base'],
    "East": ['神奈川愛川Base','茨城つくばBase','茨城中央Base','埼玉久喜Base','千葉大木戸Base','千葉市原Base'],
    "Central": ['東海木曽岬Base','静岡吉田Base','福井鯖江Base','長野飯田Base','石川金沢Base'],
    "Shin-Etsu": ['信州長野Base','新潟長岡Base','新潟横越Base'],
    "West": ['兵庫神戸Base','大阪枚方Base','Lab.West','大阪摂津Base','滋賀近江八幡Base','兵庫東条Base','和歌山桃山Base'],
    "South": ['香川さぬきBase','広島志和Base','沖縄那覇Base']
  };
}

function bindBaseOptions() {
  let html = '<option value="">全Base</option>';
  for (const region in colMap.baseRegions) {
    html += `<optgroup label="${region}">`;
    colMap.baseRegions[region].forEach(b => {
      // 表示から「Base」という文字を省いてスッキリさせる
      html += `<option value="${b}">${b.replace('Base','')}</option>`;
    });
    html += `</optgroup>`;
  }
  el('base').innerHTML = html;
}

function bindCategoryOptions(){
  const set=new Set();
  rawData.forEach(r=> { if(r[colMap.category]) set.add(r[colMap.category]) });
  const sortedCats = [...set].sort();
  el('cat').innerHTML='<option value="">すべてのカテゴリ</option>'+sortedCats.map(v=>`<option value="${v}">${v}</option>`).join('');
}

// フィルタリング処理
const runSearch = _.debounce(() => { applyFilters(); }, 250);
el('q').addEventListener('input', runSearch);
el('cat').addEventListener('change', runSearch);
el('base').addEventListener('change', runSearch);

function applyFilters(){
  const kw = (el('q').value || '').toLowerCase();
  const cat = el('cat').value;
  const base = el('base').value;

  viewData = rawData.filter(r => {
    if(cat && r[colMap.category] !== cat) return false;
    if(base && r[base] !== '〇' && r[base] !== '△') return false;
    const name = (r[colMap.name] || '').toLowerCase();
    const code = (r[colMap.id] || '').toLowerCase();
    return name.includes(kw) || code.includes(kw);
  });
  render();
}

// リスト描画（ECサイト風レスポンシブデザイン）
function render(){
  const listEl = el('list');
  el('hit-count').textContent = `${viewData.length} 件`;

  if(viewData.length === 0) {
    listEl.innerHTML = `
      <div class="col-span-full p-20 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
        <p class="text-slate-400 text-sm font-bold flex flex-col items-center gap-3">
          該当する機材が見つかりません
        </p>
      </div>`;
    return;
  }

  listEl.innerHTML = viewData.map((r, i) => {
    const firstImgId = (r.images && r.images.length > 0) ? r.images[0] : null;
    const thumbUrl = firstImgId ? `https://drive.google.com/thumbnail?id=${firstImgId}&sz=w300` : null;

   return `
    <!-- ★ flex-col などの強制縦並びクラスを削除し、app.css の指示に従わせる -->
    <div class="equipment-card group hover:border-blue-300 hover:shadow-xl md:hover:-translate-y-1 transition-all duration-300" onclick="showModal(${i})">
      
      <!-- 左側：画像エリア -->
      <div class="card-img-box relative">
        ${thumbUrl 
          ? `<img src="${thumbUrl}" loading="lazy" class="group-hover:scale-105 transition-transform duration-500">` 
          : `<div class="flex flex-col items-center text-slate-300/50 w-full">
               <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
               <span class="text-[9px] font-bold tracking-widest uppercase">No Image</span>
             </div>
             <div class="absolute inset-0 opacity-[0.03] bg-[radial-gradient(#000_1px,transparent_1px)] [background-size:16px_16px]"></div>`
        }
      </div>

      <!-- 右側：テキスト・詳細エリア -->
      <div class="card-content">
        <!-- 上部：機材コードバッジ ＆ カテゴリ -->
        <div class="flex justify-between items-center mb-1.5">
          <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-100 uppercase tracking-wider">
            ${r[colMap.id]}
          </span>
          <span class="text-[10px] font-bold text-slate-400 truncate ml-2">
            <!-- いただいた画像に合わせ、カテゴリの両端に ** ** を表示 -->
            ** ** | ${r[colMap.category] ? r[colMap.category].replace(/\*/g, '').trim() : 'カテゴリなし'} ** **
          </span>
        </div>
        
        <!-- 中部：機材名 -->
        <h3 class="font-bold text-slate-800 text-sm md:text-base leading-snug line-clamp-2 group-hover:text-blue-600 transition-colors mb-2">
          ${r[colMap.name]}
        </h3>
        
        <div class="mt-auto flex justify-between items-end">
          <!-- スペック（単重・結束数） -->
          <div class="flex gap-4">
            <div class="flex flex-col">
              <span class="text-[9px] text-slate-400 font-bold mb-0.5">単重</span>
              <span class="text-xs md:text-sm font-black text-slate-700">${r[colMap.weight] || '0'}<small class="font-normal text-[10px] ml-0.5 text-slate-500">kg</small></span>
            </div>
            <div class="flex flex-col">
              <span class="text-[9px] text-slate-400 font-bold mb-0.5">結束数</span>
              <span class="text-xs md:text-sm font-black text-slate-700">${r[colMap.stock] || '0'}<small class="font-normal text-[10px] ml-0.5 text-slate-500">束</small></span>
            </div>
          </div>
          
          <!-- スマホ用：右矢印（md:hidden で PC画面では非表示にする） -->
          <div class="text-slate-300 md:hidden pr-1 pb-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
            </svg>
          </div>
        </div>
        
        <!-- PC用：詳細を確認するボタン（hidden md:block で スマホ画面では非表示にする） -->
        <div class="hidden md:block w-full bg-slate-50 text-slate-500 text-xs font-bold py-2.5 rounded-lg text-center mt-4 group-hover:bg-blue-600 group-hover:text-white transition-colors duration-300">
          詳細を確認する
        </div>
      </div>
    </div>
    `}).join('');
}


// ==========================================
// ECサイト風 モーダル＆バリエーション切り替え処理
// ==========================================

let currentVariations = [];

// ① 機材CDから「アルファベットのベース部分（例：IQC）」を抽出する関数
function extractBaseCode(cd) {
  if (!cd) return "";
  // 最初に出てくる数字以降をすべて削り、プレフィックス（文字）だけにする
  return cd.replace(/[0-9０-９]+.*$/, '').trim();
}

// ② ボタンに表示する文字（サイズや色）を機材名から抽出する関数
function extractSizeLabel(name) {
  if (!name) return "標準";
  const match = name.match(/[0-9０-９.\s]+[^0-9０-９]*$/);
  return match ? match[0].trim() : "標準";
}

// ③ モーダルを開く処理（機材CD基準でのグループ化 ＋ 降順ソート）
function showModal(idx){
  const r = viewData[idx];
  
  // 機材CD（id）からベースコードを取得
  const baseCode = extractBaseCode(r[colMap.id]);
  
  // ベースコードが完全に一致するものを抽出
  currentVariations = rawData.filter(item => {
    const itemCode = item[colMap.id];
    if (!itemCode) return false;
    return extractBaseCode(itemCode) === baseCode;
  });

  // ★ 追加：抽出したバリエーションをサイズ（数字）の降順に並び替え
  currentVariations.sort((a, b) => {
    const getNum = (str) => {
      // 文字列から数字部分だけを抽出（全角・半角対応）
      const match = (str || '').match(/[0-9０-９.]+/);
      if (!match) return 0;
      // 全角数字を半角に変換して数値化
      const numStr = match[0].replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0));
      return parseFloat(numStr);
    };
    
    const numA = getNum(a[colMap.name]);
    const numB = getNum(b[colMap.name]);
    return numA - numB; // 降順（大きい順）
  });

  renderModalContent(r);
  
  const modal = el('modal');
  modal.style.display = 'flex';
  setTimeout(() => modal.classList.add('show'), 10);
}

function switchVariation(id) {
  const newItem = currentVariations.find(v => v[colMap.id] === id);
  if(newItem) {
    renderModalContent(newItem);
  }
}

function renderModalContent(r) {
  const imageIds = r.images || []; 
  let imageHTML = '';

  if (imageIds.length > 0) {
    const hasMultiple = imageIds.length > 1; 
    imageHTML = `
      <div class="slider-container relative w-full h-full">
        <div class="image-slider flex overflow-x-auto snap-x snap-mandatory gap-3 no-scrollbar h-full items-center" id="modalSlider">
          ${imageIds.map(id => `
            <img src="https://drive.google.com/thumbnail?id=${id}&sz=w800" 
                 class="flex-none w-full h-full snap-center object-contain cursor-zoom-in p-2" 
                 loading="lazy"
                 onclick="openZoom(this.src)"> `).join('')}
        </div>
        ${hasMultiple ? `
          <button class="slider-btn btn-prev absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow-lg flex items-center justify-center z-10" onclick="moveSlider(-1)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
          </button>
          <button class="slider-btn btn-next absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow-lg flex items-center justify-center z-10" onclick="moveSlider(1)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
          </button>
        ` : ''}
      </div>`;
  } else {
    imageHTML = `
      <div class="w-full h-full bg-slate-50 flex flex-col items-center justify-center border-2 border-dashed border-slate-200">
        <span class="text-3xl mb-2">📷</span>
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">No Image Available</span>
      </div>`;
  }

  let sizeSelectorHTML = '';
  if (currentVariations.length > 1) {
    sizeSelectorHTML = `
      <div class="mb-6 pt-4 border-t border-slate-100">
        <span class="text-[11px] font-bold text-slate-400 block mb-3 uppercase tracking-wider">サイズを選択</span>
        <div class="flex flex-wrap gap-2">
          ${currentVariations.map(v => {
            const sizeText = extractSizeLabel(v[colMap.name]);
            const isActive = (v[colMap.id] === r[colMap.id]);
            const btnClass = isActive 
              ? 'bg-slate-900 text-white border-slate-900 shadow-md' 
              : 'bg-white text-slate-600 border-slate-200 hover:border-slate-400 hover:bg-slate-50';
            
            return `
              <button onclick="switchVariation('${v[colMap.id]}')" 
                      class="min-w-[64px] px-3 py-2.5 md:py-2 border rounded-lg text-[13px] font-bold transition-all duration-200 ${btnClass}">
                ${sizeText}
              </button>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  let baseHTML = '';
  for(const region in colMap.baseRegions){
    let regionHTML = '';
    colMap.baseRegions[region].forEach(b => {
      const val = r[b] || '–';
      let colorClass = '';
      if (val === '〇') colorClass = 'bg-blue-50 text-blue-700 border-blue-200';
      else if (val === '△') colorClass = 'bg-yellow-50 text-yellow-800 border-yellow-300';
      else colorClass = 'bg-red-50 text-red-700 border-red-200 opacity-60';

      regionHTML += `
        <div class="border ${colorClass} rounded-lg py-1 px-2 flex items-center gap-1.5 min-w-[72px] justify-center">
          <span class="text-[9px] font-bold whitespace-nowrap">${b.replace('Base','')}</span>
          <span class="text-[10px] font-black">${val}</span>
        </div>`;
    });
    baseHTML += `
      <div class="mt-4">
        <h4 class="text-[11px] font-black text-slate-400 mb-2 ml-1">${region}</h4>
        <div class="flex flex-wrap gap-1.5">${regionHTML}</div>
      </div>`;
  }

 el('modalContent').innerHTML = `
    <!-- ★ 追加：スクロールしても上部にピタッと固定されるヘッダーエリア -->
    <div class="sticky top-[-10px] md:top-[-20px] z-50 flex justify-end w-full mb-4 pointer-events-none" style="margin-top: -10px;">
      
      <!-- スマホ版：引き下げバー（中央に配置） -->

      <button onclick="closeModal()" class="w-8 h-8 bg-white/90 backdrop-blur-sm text-slate-500 rounded-full flex items-center justify-center font-bold shadow-md border border-slate-100 md:hover:bg-slate-200 transition-colors pointer-events-auto">✕</button>

      <!-- ★ スマホ時は高さ260px固定、PC時は550px固定になるよう調整 ★ -->
      <div class="w-full md:w-[50%] flex-shrink-0 relative h-[260px] md:h-[550px] bg-slate-50 rounded-2xl overflow-hidden mb-6 md:mb-0 flex items-center">
        ${imageHTML}
      </div>

        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">

        <!-- スマホでも読みやすい文字サイズに調整 -->
        <h2 class="text-xl md:text-2xl font-black text-slate-900 leading-tight mb-6">
          ${r[colMap.name]}
        </h2>
        
        ${sizeSelectorHTML}

        <div class="bg-slate-50 rounded-2xl p-5 mb-8 border border-slate-100">
          <div class="flex justify-between items-center border-b border-slate-200 pb-3 mb-3">
            <span class="text-xs font-bold text-slate-500">単品重量</span>
            <span class="text-lg font-black text-slate-900">${r[colMap.weight] || '0'} <span class="text-xs font-normal text-slate-500">kg</span></span>
          </div>
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-slate-500">結束数</span>
            <span class="text-lg font-black text-slate-900">${r[colMap.stock] || '0'} <span class="text-xs font-normal text-slate-500">束</span></span>
          </div>
        </div>

        <div class="mt-auto pt-6 border-t border-slate-100">
           <h3 class="text-[13px] font-bold text-slate-900 mb-4 flex items-center gap-2">
            <span class="w-1 h-3 bg-blue-500 rounded-full"></span>取り扱いBase
          </h3>
          <div class="space-y-4">
            ${baseHTML}
          </div>
        </div>
      </div>
    </div>
  `;
}

// 矢印ボタン用のスライド関数
function moveSlider(dir) {
  const s = el('modalSlider');
  if(s) s.scrollBy({ left: s.clientWidth * dir, behavior: 'smooth' });
}


// --- 1. モーダルを閉じる（既存） ---
function closeModal(){
  const modal = el('modal');
  modal.classList.remove('show');
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

// インストールバーを一時的に隠す関数
function hideInstallBar() {
  const installArea = document.getElementById('install-area');
  if (installArea) installArea.style.display = 'none';
}

// 追加ボタンを押した時のYes/Noダイアログ
function openInstallDialog() {
  showGuide(); 
}

// ガイドを表示する (今回作成したもの)
function showGuide() {
  const overlay = document.getElementById('guide-overlay');
  const guide = document.getElementById('ios-guide');
  
  overlay.style.display = 'block';
  guide.style.display = 'block';
  guide.style.pointerEvents = 'auto'; // これを追加（クリックできるようにする）
  
  setTimeout(() => {
    overlay.style.opacity = "1";
    guide.style.opacity = "1";
    guide.style.transform = "translate(-50%, -50%) scale(1)"; // 中央にぴったり配置
  }, 10);
}

// ガイドを閉じる (今回作成したもの)
function closeGuide() {
  const overlay = document.getElementById('guide-overlay');
  const guide = document.getElementById('ios-guide');
  overlay.style.opacity = "0";
  guide.style.opacity = "0";
  guide.style.transform = "translate(-50%, -45%) scale(0.95)";
  setTimeout(() => {
    overlay.style.display = 'none';
    guide.style.display = 'none';
    hideInstallBar();
  }, 300);
}

// ページ読み込み時の判定（既存の処理を微調整）
window.addEventListener('DOMContentLoaded', () => {
  loadData();

  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const installArea = document.getElementById('install-area');

  if (installArea) {
    if (isStandalone) {
      installArea.style.display = 'none';
    } else {
      // テスト時はここを 'block' に。本番は isiOS ? 'block' : 'none'
      installArea.style.display = isiOS ? 'block' : 'none';
    }
  }
});

// --- 5. サービスワーカー ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>

<div id="image-zoom-overlay" onclick="closeZoom()" 
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; cursor:zoom-out;">
  <img id="zoomed-image" src="" style="max-width:95%; max-height:95%; object-fit:contain; transition: transform 0.3s ease;">
  <div style="position:absolute; top:20px; right:20px; color:white; font-size:30px;">✕</div>
</div>

<script>
// ズーム状態を管理する変数
let zoomScale = 1;

// 画像を拡大表示する関数
function openZoom(src) {
  const overlay = document.getElementById('image-zoom-overlay');
  const img = document.getElementById('zoomed-image');
  
  // 高画質画像（w1600）に差し替え
  img.src = src.split('&sz=')[0] + '&sz=w1600';
  
  // 初期化
  zoomScale = 1;
  img.style.transformOrigin = 'center';
  img.style.transform = `scale(${zoomScale})`;
  
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden'; // 背景スクロール禁止
}

// マウスホイールでのズームイベント
document.getElementById('zoomed-image').addEventListener('wheel', function(e) {
  e.preventDefault(); // 画面全体のスクロールを防止

  // ホイールの回転方向で倍率を計算 (上回しで拡大 / 下回しで縮小)
  const delta = e.deltaY > 0 ? -0.2 : 0.2;
  const newScale = zoomScale + delta;

  // 倍率制限（最小0.5倍、最大5倍まで）
  if (newScale >= 0.5 && newScale <= 5) {
    zoomScale = newScale;
    
    // マウスカーソルの位置を中心にズームさせる
    const rect = this.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    
    this.style.transformOrigin = `${x}% ${y}%`;
    this.style.transform = `scale(${zoomScale})`;
  }
}, { passive: false });

// 拡大画面内で画像をクリックした時にリセット（通常 ⇔ 2倍）
document.getElementById('zoomed-image').addEventListener('click', function(e) {
  e.stopPropagation();
  if (zoomScale > 1.1) {
    zoomScale = 1;
  } else {
    zoomScale = 2;
    this.style.transformOrigin = 'center';
  }
  this.style.transform = `scale(${zoomScale})`;
});

// 拡大を閉じる関数
function closeZoom() {
  document.getElementById('image-zoom-overlay').style.display = 'none';
  document.body.style.overflow = ''; // スクロール再開
}
</script>
