<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>機材検索 </title>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
  
  <link rel="stylesheet" href="app.css?v=1.0.1">
</head>

<body class="bg-blue-80 text-slate-900 select-none antialiased">

<div class="w-full max-w-screen-xl mx-auto min-h-screen flex flex-col bg-white shadow-xl">
  <header class="sticky top-0 bg-slate-300 backdrop-blur-lg z-40 px-5 pb-4 border-b border-slate-300">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-extrabold tracking-tight text-slate-800">機材検索</h1>
    <span id="hit-count" class="bg-blue-100 text-blue-600 text-xs font-bold px-2.5 py-1 rounded-full">-- 件</span>
  </div>

<div id="install-area" class="mb-6 bg-blue-600 rounded-[32px] p-6 shadow-xl shadow-blue-900/20 transition-all duration-300" style="display:none;">
  <div class="flex flex-col items-center text-center gap-5">
    
    <div class="space-y-2">
      <div class="text-3xl">📱</div>
      <h2 class="text-white text-lg font-black tracking-tight">
        アプリ版をホーム画面に追加
      </h2>
      <p class="text-blue-100 text-[11px] font-medium leading-relaxed opacity-90">
        全画面表示で、機材検索がもっとスムーズに。<br>オフラインでも使いやすくなります。
      </p>
    </div>
    
    <div class="flex flex-col w-full gap-3">
      <button onclick="openInstallDialog()" 
              class="w-full bg-white text-blue-700 py-3.5 rounded-2xl text-sm font-black shadow-lg active:scale-[0.97] transition-all">
        ホーム画面に追加する
      </button>
      
      <button onclick="hideInstallBar()" 
              class="text-white/60 text-xs font-bold hover:text-white transition-colors py-1">
        今はしない
      </button>
    </div>

  </div>
</div>
  
  <div class="flex flex-col md:flex-row gap-3">
    <div class="relative flex-[2]">
      <input id="q" type="search" placeholder="機材名・コードで検索..." 
             class="w-full pl-4 pr-10 py-3 rounded-2xl bg-slate-100 border-none focus:ring-2 focus:ring-blue-500 transition-all text-base" />
    </div>
    <div class="flex flex-1 gap-2">
      <select id="cat" class="w-full px-4 py-2 rounded-xl bg-slate-100 border-none text-sm font-medium text-slate-600 focus:ring-2 focus:ring-blue-500"></select>
    </div>
  </div>
</header>

 <main class="flex-1 bg-slate-300">
  <div id="list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 p-6">
      <div id="loading-state" class="p-10 text-center text-slate-400">
        <div class="animate-pulse flex flex-col items-center">
          <div class="w-12 h-12 bg-slate-200 rounded-full mb-4"></div>
          <p class="text-sm">データを読み込み中...</p>
        </div>
      </div>
    </div>
  </main>


  <footer class="p-4 safe-area-bottom text-center">
    <p class="text-[10px] text-slate-300 uppercase tracking-widest">Equipment Search System v2.0</p>
  </footer>
</div>

<div id="modal" onclick="closeModal()">
  <div id="modalContent" onclick="event.stopPropagation()"></div>
</div>

<script>
let rawData = [], viewData = [], colMap = {};
const el = id => document.getElementById(id);

// 1. 起動時にキャッシュをチェック
async function loadData() {
  const url = "https://script.google.com/macros/s/AKfycbx-07D6SfSB4UJ4o5LlE5gLaQ2WegQiDkrgnWENzkR6-7RTy9xrw2goIJO7uTMCJd8aDQ/exec";
  const CACHE_KEY = 'equipment_data_cache';

  // ローカルストレージからデータを読み込む
  const cachedData = localStorage.getItem(CACHE_KEY);
  if (cachedData) {
    rawData = JSON.parse(cachedData);
    initAfterLoad(); // キャッシュがあれば即座に表示
    console.log("Cache loaded: Instant display");
  }

  // 裏側で最新データを取得（バックグラウンド更新）
  try {
    const res = await fetch(url);
    const newData = await res.json();
    
    // データが更新されていた場合、またはキャッシュがなかった場合のみ再描画
    if (JSON.stringify(newData) !== cachedData) {
      rawData = newData;
      localStorage.setItem(CACHE_KEY, JSON.stringify(newData));
      initAfterLoad();
      console.log("Data updated from Spreadsheet");
    }
  } catch (e) {
    if (!cachedData) {
      el('list').innerHTML = `<div class="p-10 text-center text-red-500">通信エラー（初回はネット接続が必要です）</div>`;
    }
  }
}

function initAfterLoad() {
  normalizeColumns();
  bindCategoryOptions();
  applyFilters();
}

function normalizeColumns(){
  // カラムマッピングの定義
  const map={
    code:['機材コード','code'], category:['区分','category'], name:['機材名','name'],
    weight:['単品重量（kg)','weight'], id:['機材ＣＤ','機材CD','id'], stock:['結束数（本）','stock']
  };
  for(const key in map) colMap[key]=map[key].find(c=>c in rawData[0])||'';
  
  colMap.baseRegions={
    "North": ['宮城仙台第二Base','青森東通Base','福島広野Base','岩手盛岡Base'],
    "East": ['神奈川愛川Base','茨城つくばBase','茨城中央Base','埼玉久喜Base','千葉大木戸Base','千葉市原Base'],
    "Central": ['東海木曽岬Base','静岡吉田Base','福井鯖江Base','長野飯田Base','石川金沢Base'],
    "Shin-Etsu": ['信州長野Base','新潟長岡Base','新潟横越Base'],
    "West": ['兵庫神戸Base','大阪枚方Base','Lab.West','大阪摂津Base','滋賀近江八幡Base','兵庫東条Base','和歌山桃山Base'],
    "South": ['香川さぬきBase','広島志和Base','沖縄那覇Base']
  };
}

function bindCategoryOptions(){
  const set=new Set();
  rawData.forEach(r=> { if(r[colMap.category]) set.add(r[colMap.category]) });
  const sortedCats = [...set].sort();
  el('cat').innerHTML='<option value="">すべてのカテゴリ</option>'+sortedCats.map(v=>`<option value="${v}">${v}</option>`).join('');
}

// フィルタリング処理
const runSearch = _.debounce(() => { applyFilters(); }, 250);
el('q').addEventListener('input', runSearch);
el('cat').addEventListener('change', runSearch);

function applyFilters(){
  const kw = (el('q').value || '').toLowerCase();
  const cat = el('cat').value;
  
  viewData = rawData.filter(r => {
    if(cat && r[colMap.category] !== cat) return false;
    const name = (r[colMap.name] || '').toLowerCase();
    const code = (r[colMap.id] || '').toLowerCase();
    return name.includes(kw) || code.includes(kw);
  });
  render();
}

// リスト描画（カードデザイン：影強化版）
function render(){
  const listEl = el('list');
  el('hit-count').textContent = `${viewData.length} 件`;

  if(viewData.length === 0) {
    listEl.innerHTML = `
      <div class="col-span-full p-20 text-center bg-white rounded-3xl border-2 border-dashed border-slate-200">
        <p class="text-slate-400 text-sm font-bold flex flex-col items-center gap-3">
          該当する機材が見つかりません
        </p>
      </div>`;
    return;
  }

  listEl.innerHTML = viewData.map((r, i) => {
    // 最初の1枚をサムネイルに使用（sz=w300で軽量化）
    const firstImgId = (r.images && r.images.length > 0) ? r.images[0] : null;
    const thumbUrl = firstImgId ? `https://drive.google.com/thumbnail?id=${firstImgId}&sz=w300` : null;

    return `
    <div class="equipment-card group" onclick="showModal(${i})">
      
      <div class="card-img-box">
        ${thumbUrl 
          ? `<img src="${thumbUrl}" loading="lazy" class="group-hover:scale-105 transition-transform duration-300">` 
          : `<div class="flex flex-col items-center text-slate-300">
               <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
               <span class="text-[8px] font-bold uppercase">No Image</span>
             </div>`
        }
      </div>

      <div class="card-content">
        <div class="w-full">
          <div class="flex items-center justify-between mb-1">
            <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded border border-blue-100 uppercase">
              ${r[colMap.id]}
            </span>
            <span class="text-[10px] font-bold text-slate-400 truncate ml-2">
              ** ${r[colMap.category]} **
            </span>
          </div>
          <h3 class="font-bold text-slate-800 text-sm leading-snug line-clamp-2 group-hover:text-blue-600 transition-colors">
            ${r[colMap.name]}
          </h3>
        </div>
        
        <div class="flex items-end justify-between mt-auto">
          <div class="flex gap-4">
            <div class="flex flex-col">
              <span class="text-[8px] text-slate-400 font-black uppercase leading-none mb-1">単重</span>
              <span class="text-xs font-bold text-slate-700">${r[colMap.weight]}<small class="font-normal ml-0.5">kg</small></span>
            </div>
            <div class="flex flex-col">
              <span class="text-[8px] text-slate-400 font-black uppercase leading-none mb-1">結束数</span>
              <span class="text-xs font-bold text-slate-700">${r[colMap.stock]}<small class="font-normal ml-0.5">束</small></span>
            </div>
          </div>
          
          <div class="text-slate-300 group-hover:text-blue-500 group-hover:translate-x-1 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
            </svg>
          </div>
        </div>
      </div>
    </div>
  `}).join('');
}


// モーダル表示
function showModal(idx){
  const r = viewData[idx];

  console.log("選択した機材の全データ:", r); 

  // ★ここから差し替え開始★
  // --- 1. 画像スライダーの生成ロジック（矢印＆ドット付き） ---
  const imageIds = r.images || []; 
  let imageHTML = '';

  if (imageIds.length > 0) {
    const hasMultiple = imageIds.length > 1; 
    
    imageHTML = `
      <div class="slider-container relative w-full">
        <div class="image-slider flex overflow-x-auto snap-x snap-mandatory gap-3 py-2 no-scrollbar" id="modalSlider">
          ${imageIds.map(id => `
            <img src="https://drive.google.com/thumbnail?id=${id}&sz=w800" 
                 class="flex-none w-full snap-center h-64 object-contain bg-slate-50 rounded-2xl shadow-sm cursor-zoom-in" 
                 loading="lazy"
                 onclick="openZoom(this.src)"> `).join('')}
        </div>
        
        ${hasMultiple ? `
          <button class="slider-btn btn-prev absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow-lg flex items-center justify-center z-10" onclick="moveSlider(-1)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M15 19l-7-7 7-7" /></svg>
          </button>
          <button class="slider-btn btn-next absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow-lg flex items-center justify-center z-10" onclick="moveSlider(1)">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 5l7 7-7 7" /></svg>
          </button>
          
          <div class="slider-dots flex justify-center gap-1.5 mt-3" id="sliderDots">
            ${imageIds.map((_, i) => `<div class="dot w-1.5 h-1.5 rounded-full transition-all duration-300 ${i === 0 ? 'bg-blue-500 w-4' : 'bg-slate-300'}"></div>`).join('')}
          </div>
        ` : ''}
      </div>`;
  } else {
    imageHTML = `
      <div class="h-48 bg-slate-50 rounded-2xl flex flex-col items-center justify-center border-2 border-dashed border-slate-200">
        <span class="text-3xl mb-2">📷</span>
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">No Image Available</span>
      </div>`;
  }

  let baseHTML = '';
  for(const region in colMap.baseRegions){
    baseHTML += `
      <div class="mt-3">
        <h4 class="text-[12px] font-black text-slate-400 mb-2 ml-1">${region}</h4>
        <div class="flex flex-wrap gap-1.5">
    `;

    colMap.baseRegions[region].forEach(b => {
      const val = r[b] || '–';
      let colorClass = '';
      if (val === '〇') {
        colorClass = 'bg-blue-50 text-blue-700 border-blue-200';
      } else if (val === '△') {
        colorClass = 'bg-yellow-50 text-yellow-800 border-yellow-300';
      } else {
        colorClass = 'bg-red-50 text-red-700 border-red-200 opacity-60'; // ×は少し薄くして視認性を高める
      }

      baseHTML += `
        <div class="border ${colorClass} rounded-lg py-1 px-2 flex items-center gap-1.5 min-w-[80px] justify-center">
          <span class="text-[9px] font-bold whitespace-nowrap">${b.replace('Base','')}</span>
          <span class="text-[10px] font-black">${val}</span>
        </div>`;
    });
    baseHTML += `</div></div>`;
  }

  // --- HTMLを組み立てて表示 ---
  el('modalContent').innerHTML = `
    <div class="bg-white pt-5 pb-4 px-4 rounded-t-[20px] relative z-20 border-b border-slate-100">
      
      <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
      
      <button onclick="closeModal()" class="absolute top-3 right-3 w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center font-bold z-40">✕</button>

      <div class="max-w-6xl mx-auto">
        <div class="flex flex-row gap-4 items-start">
          
          <div class="w-[45%] flex-shrink-0">
            ${imageHTML}
          </div>

          <div class="flex-1 min-w-0 pt-0.5">
            <h2 class="text-[15px] font-black text-slate-950 leading-tight mb-1 line-clamp-2">${r[colMap.name]}</h2>
            
            <div class="space-y-1 text-[10px] border-t border-slate-100 pt-2">
              <div class="flex justify-between border-b border-dotted border-slate-200 pb-0.5">
                <span class="text-slate-400 flex-shrink-0">区分</span>
                <span class="font-bold text-slate-800 truncate ml-2">${r[colMap.category] || '-'}</span>
              </div>
              <div class="flex justify-between border-b border-dotted border-slate-200 pb-0.5">
                <span class="text-slate-400 flex-shrink-0">機材CD</span>
                <span class="font-bold text-slate-800 truncate ml-2">${r[colMap.id] || '-'}</span>
              </div>
              <div class="flex justify-between border-b border-dotted border-slate-200 pb-0.5">
                <span class="text-slate-400 flex-shrink-0">単重</span>
                <span class="font-bold text-slate-800 ml-2">${r[colMap.weight] || '0'}kg</span>
              </div>
              <div class="flex justify-between border-b border-dotted border-slate-200 pb-0.5">
                <span class="text-slate-400 flex-shrink-0">結束</span>
                <span class="font-bold text-slate-800 ml-2">${r[colMap.stock] || '0'}束</span>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <div class="bg-white px-4 pt-4 pb-10 relative z-10">
      <div class="max-w-6xl mx-auto">
        <h3 class="text-[13px] font-bold text-slate-950 mb-3 flex items-center gap-2">
          <span class="w-1 h-3 bg-blue-500 rounded-full"></span>在庫状況
        </h3>
        <div class="space-y-4">
          ${baseHTML}
        </div>
      </div>
    </div>
  `;
  
  // スライダーのスクロール監視（ドットの更新）
  if (imageIds.length > 1) {
    const s = el('modalSlider');
    s.addEventListener('scroll', () => {
      const index = Math.round(s.scrollLeft / s.clientWidth);
      const dots = document.querySelectorAll('.dot');
      dots.forEach((d, i) => {
        if(i === index) {
          d.classList.replace('bg-slate-300', 'bg-blue-500');
          d.classList.add('w-4');
        } else {
          d.classList.replace('bg-blue-500', 'bg-slate-300');
          d.classList.remove('w-4');
        }
      });
    });
  }

  const modal = el('modal');
  modal.style.display = 'flex';
  setTimeout(() => modal.classList.add('show'), 10);
}

// 矢印ボタン用のスライド関数
function moveSlider(dir) {
  const s = el('modalSlider');
  s.scrollBy({ left: s.clientWidth * dir, behavior: 'smooth' });
}
// --- 1. モーダルを閉じる（既存） ---
function closeModal(){
  const modal = el('modal');
  modal.classList.remove('show');
  setTimeout(() => { modal.style.display = 'none'; }, 300);
}

// インストールバーを一時的に隠す関数
function hideInstallBar() {
  const installArea = document.getElementById('install-area');
  if (installArea) installArea.style.display = 'none';
}

// 追加ボタンを押した時のYes/Noダイアログ
function openInstallDialog() {
  showGuide(); 
}

// ガイドを表示する (今回作成したもの)
function showGuide() {
  const overlay = document.getElementById('guide-overlay');
  const guide = document.getElementById('ios-guide');
  
  overlay.style.display = 'block';
  guide.style.display = 'block';
  guide.style.pointerEvents = 'auto'; // これを追加（クリックできるようにする）
  
  setTimeout(() => {
    overlay.style.opacity = "1";
    guide.style.opacity = "1";
    guide.style.transform = "translate(-50%, -50%) scale(1)"; // 中央にぴったり配置
  }, 10);
}

// ガイドを閉じる (今回作成したもの)
function closeGuide() {
  const overlay = document.getElementById('guide-overlay');
  const guide = document.getElementById('ios-guide');
  overlay.style.opacity = "0";
  guide.style.opacity = "0";
  guide.style.transform = "translate(-50%, -45%) scale(0.95)";
  setTimeout(() => {
    overlay.style.display = 'none';
    guide.style.display = 'none';
    hideInstallBar();
  }, 300);
}

// ページ読み込み時の判定（既存の処理を微調整）
window.addEventListener('DOMContentLoaded', () => {
  loadData();

  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const installArea = document.getElementById('install-area');

  if (installArea) {
    if (isStandalone) {
      installArea.style.display = 'none';
    } else {
      // テスト時はここを 'block' に。本番は isiOS ? 'block' : 'none'
      installArea.style.display = isiOS ? 'block' : 'none';
    }
  }
});

// --- 5. サービスワーカー ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>

<div id="guide-overlay" onclick="closeGuide()" 
     style="display:none; position:fixed; inset:0; background:rgba(15, 23, 42, 0.7); z-index:9999; backdrop-filter:blur(4px); opacity:0; transition: opacity 0.3s ease;">
</div>

<div id="ios-guide" 
     style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -45%) scale(0.95); width:90%; max-width:360px; z-index:10000; opacity:0; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); pointer-events: none;">
  
  <div class="bg-white rounded-[40px] p-8 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.5)] relative text-center border border-white/20">
    
    <button onclick="closeGuide()" class="absolute top-6 right-6 text-slate-300 hover:text-slate-500 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
    </button>

    <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-50 rounded-full mb-6">
      <span class="text-4xl">📱</span>
    </div>
    
    <h3 class="text-xl font-black text-slate-800 mb-8">ホーム画面に追加</h3>
    
    <div class="text-left space-y-4 mb-8">
      <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
        <div class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-black flex-shrink-0 shadow-md">1</div>
        <p class="text-[13px] text-slate-700 font-bold flex-1 leading-tight">
          下の<strong>「共有ボタン」</strong>をタップ
        </p>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"></path>
          <polyline points="16 6 12 2 8 6"></polyline>
          <line x1="12" y1="2" x2="12" y2="15"></line>
        </svg>
      </div>

      <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-2xl border border-slate-100">
        <div class="bg-blue-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-black flex-shrink-0 shadow-md">2</div>
        <p class="text-[13px] text-slate-700 font-bold flex-1 leading-tight">
          <strong>「ホーム画面に追加」</strong>を選択
        </p>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <rect x="2" y="2" width="20" height="20" rx="4" stroke-width="1.5"></rect>
        </svg>
      </div>
    </div>

    <button onclick="closeGuide()" class="w-full py-4 bg-[#0f172a] text-white text-base font-black rounded-2xl active:scale-[0.95] transition-all shadow-lg shadow-slate-200">
      OK
    </button>
  </div>
</div>

<div id="image-zoom-overlay" onclick="closeZoom()" 
     style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:2000; align-items:center; justify-content:center; cursor:zoom-out;">
  <img id="zoomed-image" src="" style="max-width:95%; max-height:95%; object-fit:contain; transition: transform 0.3s ease;">
  <div style="position:absolute; top:20px; right:20px; color:white; font-size:30px;">✕</div>
</div>

<script>
// ズーム状態を管理する変数
let zoomScale = 1;

// 画像を拡大表示する関数
function openZoom(src) {
  const overlay = document.getElementById('image-zoom-overlay');
  const img = document.getElementById('zoomed-image');
  
  // 高画質画像（w1600）に差し替え
  img.src = src.split('&sz=')[0] + '&sz=w1600';
  
  // 初期化
  zoomScale = 1;
  img.style.transformOrigin = 'center';
  img.style.transform = `scale(${zoomScale})`;
  
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden'; // 背景スクロール禁止
}

// マウスホイールでのズームイベント
document.getElementById('zoomed-image').addEventListener('wheel', function(e) {
  e.preventDefault(); // 画面全体のスクロールを防止

  // ホイールの回転方向で倍率を計算 (上回しで拡大 / 下回しで縮小)
  const delta = e.deltaY > 0 ? -0.2 : 0.2;
  const newScale = zoomScale + delta;

  // 倍率制限（最小0.5倍、最大5倍まで）
  if (newScale >= 0.5 && newScale <= 5) {
    zoomScale = newScale;
    
    // マウスカーソルの位置を中心にズームさせる
    const rect = this.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    
    this.style.transformOrigin = `${x}% ${y}%`;
    this.style.transform = `scale(${zoomScale})`;
  }
}, { passive: false });

// 拡大画面内で画像をクリックした時にリセット（通常 ⇔ 2倍）
document.getElementById('zoomed-image').addEventListener('click', function(e) {
  e.stopPropagation();
  if (zoomScale > 1.1) {
    zoomScale = 1;
  } else {
    zoomScale = 2;
    this.style.transformOrigin = 'center';
  }
  this.style.transform = `scale(${zoomScale})`;
});

// 拡大を閉じる関数
function closeZoom() {
  document.getElementById('image-zoom-overlay').style.display = 'none';
  document.body.style.overflow = ''; // スクロール再開
}
</script>
</body>
</html>
